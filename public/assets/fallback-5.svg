<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Garden background -->
  <rect width="800" height="600" fill="#98D8C8"/>

  <!-- Cartoon Rabbit -->
  <!-- Body -->
  <ellipse cx="400" cy="370" rx="90" ry="110" fill="#F5F5DC"/>

  <!-- Head -->
  <circle cx="400" cy="280" r="80" fill="#F5F5DC"/>

  <!-- Ears -->
  <ellipse cx="360" cy="180" rx="25" ry="80" fill="#F5F5DC"/>
  <ellipse cx="440" cy="180" rx="25" ry="80" fill="#F5F5DC"/>
  <ellipse cx="360" cy="180" rx="15" ry="60" fill="#FFB6C1"/>
  <ellipse cx="440" cy="180" rx="15" ry="60" fill="#FFB6C1"/>

  <!-- Eyes -->
  <circle cx="375" cy="270" r="12" fill="#333"/>
  <circle cx="425" cy="270" r="12" fill="#333"/>
  <circle cx="377" cy="272" r="5" fill="#FFF"/>
  <circle cx="427" cy="272" r="5" fill="#FFF"/>

  <!-- Nose -->
  <circle cx="400" cy="295" r="8" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 400 295 L 400 310 M 400 310 Q 385 320 375 310 M 400 310 Q 415 320 425 310" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <line x1="340" y1="285" x2="300" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="295" x2="300" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="285" x2="500" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="295" x2="500" y2="300" stroke="#333" stroke-width="2"/>

  <!-- Grass -->
  <rect x="0" y="500" width="800" height="100" fill="#7FD957"/>
</svg>

<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- Puzzle pieces -->
  <rect x="80" y="80" width="160" height="160" fill="#FF6B6B" rx="15" opacity="0.9"/>
  <rect x="272" y="80" width="160" height="160" fill="#4ECDC4" rx="15" opacity="0.9"/>
  <rect x="80" y="272" width="160" height="160" fill="#FFE66D" rx="15" opacity="0.9"/>
  <rect x="272" y="272" width="160" height="160" fill="#95E1D3" rx="15" opacity="0.9"/>

  <!-- Center highlight -->
  <circle cx="256" cy="256" r="40" fill="white" opacity="0.3"/>
</svg>
